events {}

http {
    # WebSocket / HMR 用；一般請求會是空字串
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 三個服務跑在 Windows 主機上（非容器），用 host-gateway 回連
    upstream frontend { server host.docker.internal:3000; }
    upstream backend  { server host.docker.internal:8000; }
    upstream rag      { server host.docker.internal:8001; }

    # 非本網域的 Host（掃描器、直接打 IP）直接斷線
    server {
        listen 80 default_server;
        return 444;
    }

    server {
        listen 80;
        server_name stock-lighthouse.com www.stock-lighthouse.com;

        client_max_body_size 10m;

        # 同一個網域三條路徑：/ 前端、/backend 後端、/rag RAG。
        # 全部同源，瀏覽器不會有 CORS 問題。
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }

        # /backend/* → backend:8000（proxy_pass 尾端斜線會把 /backend 前綴去掉）
        # AI 分析可能跑數分鐘，關掉緩衝並拉長 timeout
        location /backend/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering  off;
            proxy_read_timeout 600s;
        }

        # /rag/* → rag:8001。問答是 SSE 串流，Connection 必須留空
        location /rag/ {
            proxy_pass http://rag/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_buffering  off;
            proxy_cache      off;
            proxy_read_timeout 600s;
        }
    }
}
