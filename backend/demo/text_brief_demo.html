<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>個股文字簡報 DEMO · text-first-v2</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#1a1d23; --muted:#6b7280; --line:#e3e6ea;
  --pos:#0f7b4f; --pos-bg:#e7f6ee; --neg:#b3261e; --neg-bg:#fdecea;
  --warn:#8a5300; --warn-bg:#fff4e0; --info:#1d4ed8; --info-bg:#e8eefc;
  --accent:#1d4ed8; --hl:#fff3bf; --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161a; --panel:#1c1f25; --ink:#e6e8ec; --muted:#9aa3af; --line:#2c313a;
    --pos:#4ade80; --pos-bg:#123024; --neg:#fca5a5; --neg-bg:#3a1a18;
    --warn:#fbbf24; --warn-bg:#3a2c10; --info:#93b4fd; --info-bg:#182444;
    --accent:#7ea6ff; --hl:#4a3f16;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 "Noto Sans TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0}

/* ── 控制列 ───────────────────────────────── */
.bar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin:16px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px}
.f>label{font-size:12px;color:var(--muted)}
input,select,button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:7px 9px}
input[type=text]{min-width:230px}
button{background:var(--accent);color:#fff;border-color:transparent;cursor:pointer;font-weight:600;padding:8px 18px}
button:disabled{opacity:.55;cursor:default}
button.ghost{background:transparent;color:var(--accent);border-color:var(--line);font-weight:500}
.chk{flex-direction:row;align-items:center;gap:6px}
.chk input{width:16px;height:16px}
.chk label{font-size:14px;color:var(--ink)}

/* ── 狀態列 ───────────────────────────────── */
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-4px 0 16px;min-height:26px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.tag.ok{background:var(--pos-bg);color:var(--pos)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--neg-bg);color:var(--neg)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.plain{background:transparent;color:var(--muted);border-color:var(--line)}

/* ── 版面 ─────────────────────────────────── */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:16px}
.card>h2{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.side{position:sticky;top:16px}
@media (max-width:1000px){.side{position:static}}

/* ── headline ─────────────────────────────── */
.headline{font-size:22px;font-weight:700;line-height:1.5;margin:0 0 12px}
.reason{color:var(--muted);font-size:13.5px;margin:10px 0 0}

/* ── 條目 ─────────────────────────────────── */
.item{padding:10px 12px;border-radius:8px;border:1px solid transparent;cursor:pointer;
  transition:background .12s,border-color .12s}
.item:hover{border-color:var(--line)}
.item.on{background:var(--hl);border-color:var(--line)}
.item+.item{margin-top:4px}
.item p{margin:0}
.dir{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:7px;vertical-align:1px}
.dir.positive{background:var(--pos)}.dir.negative{background:var(--neg)}
.dir.mixed{background:var(--warn)}.dir.neutral,.dir.not_applicable{background:var(--muted)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px}
.note{font-size:13px;color:var(--muted);margin:4px 0 0}

/* ── 關鍵日時間軸 ─────────────────────────── */
.kd{display:grid;grid-template-columns:96px 82px 78px minmax(0,1fr);gap:10px;align-items:baseline;
  padding:11px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.kd:hover{border-color:var(--line)}
.kd.on{background:var(--hl);border-color:var(--line)}
.kd+.kd{border-top:1px dashed var(--line);border-radius:0 0 8px 8px}
.kd .d{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.kd .m{font-variant-numeric:tabular-nums;font-weight:700}
.kd .v{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
@media (max-width:720px){.kd{grid-template-columns:1fr 1fr;gap:4px}.kd .w{grid-column:1/-1}}

/* ── evidence chips ───────────────────────── */
.chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;font-family:ui-monospace,Consolas,monospace;padding:2px 7px;border-radius:5px;
  background:var(--info-bg);color:var(--info);border:1px solid transparent;cursor:pointer}
.chip:hover,.chip.on{border-color:currentColor}

/* ── 未來看法 ─────────────────────────────── */
.fv{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.fv{grid-template-columns:1fr}}
.fv>div{border:1px solid var(--line);border-radius:8px;padding:12px}
.fv .h{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px}
.inv{font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

/* ── 證據目錄 ─────────────────────────────── */
.ev{padding:8px 10px;border-radius:7px;border:1px solid transparent;font-size:13px;cursor:pointer}
.ev:hover{border-color:var(--line)}
.ev.on{background:var(--hl);border-color:var(--line)}
.ev .id{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--info);margin-right:6px}
.ev .k{color:var(--muted);font-size:12px}
.ev .val{font-variant-numeric:tabular-nums}
.evgrp{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;
  margin:12px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.evgrp:first-child{margin-top:0}

/* ── 稽核表 ───────────────────────────────── */
.vf{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.vf:last-child{border-bottom:0}
.vf .n{color:var(--muted);font-size:12.5px}
.vf code{font-size:11.5px;font-family:ui-monospace,Consolas,monospace;color:var(--warn);
  text-align:right;word-break:break-all}

/* ── 其他 ─────────────────────────────────── */
.ul{margin:0;padding-left:18px}
.ul li{margin:3px 0;font-size:13.5px;color:var(--muted)}
.disc{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:11px 13px;line-height:1.65}
.hint{color:var(--muted);font-size:13px}
.err{background:var(--neg-bg);color:var(--neg);border:1px solid transparent;
  border-radius:8px;padding:12px 14px;font-size:13.5px}
.err code{display:block;margin-top:6px;font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:99px;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stages span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);
  border:1px solid var(--line);color:var(--muted)}
.stages span.now{background:var(--info-bg);color:var(--info);border-color:transparent;font-weight:600}
.stages span.done{background:var(--pos-bg);color:var(--pos);border-color:transparent}
.hide{display:none}
</style>
</head>

let claimNodes = [];   // {node, ids:Set}
let evNodes = new Map(); // id -> node

function clearHL(){
  claimNodes.forEach(c => c.node.classList.remove('on'));
  evNodes.forEach(n => n.classList.remove('on'));
  document.querySelectorAll('.chip.on').forEach(n => n.classList.remove('on'));
}
/** 點結論 → 亮它引用的證據 */
function focusClaim(entry){
  const already = entry.node.classList.contains('on');
  clearHL();
  if (already) return;
  entry.node.classList.add('on');
  let first = null;
  entry.ids.forEach(id => {
    const n = evNodes.get(id);
    if (n){ n.classList.add('on'); first = first || n; }
  });
  if (first) first.scrollIntoView({block:'nearest', behavior:'smooth'});
}
/** 點證據 → 反向亮出所有引用它的結論 */
function focusEvidence(id){
  const node = evNodes.get(id);
  const already = node && node.classList.contains('on');
  clearHL();
  if (already) return;
  if (node) node.classList.add('on');
  let first = null;
  claimNodes.forEach(c => {
    if (c.ids.has(id)){ c.node.classList.add('on'); first = first || c.node; }
  });
  if (first) first.scrollIntoView({block:'center', behavior:'smooth'});
}

function chips(ids){
  const box = el('div','chips');
  (ids || []).forEach(id => {
    const c = el('span','chip', id);
    c.onclick = e => { e.stopPropagation(); focusEvidence(id); };
    box.appendChild(c);
  });
  return box;
}
/** 建一個可點擊、會亮出對應證據的條目 */
function claim(ids, build){
  const node = el('div','item');
  build(node);
  if (ids && ids.length) node.appendChild(chips(ids));
  const entry = {node, ids:new Set(ids || [])};
  claimNodes.push(entry);
  node.onclick = () => focusClaim(entry);
  return node;
}

function evValue(item){

  const extra = [];

    const two2 = el('div','two');
    two2.appendChild(card('需要留意的風險', riskList(b.risks)));
    two2.appendChild(card('接下來觀察什麼', watchList(b.watch_points)));
    main.appendChild(two2);

    main.appendChild(card('未來看法　（只給方向與失效條件，不含任何價格數字）',
      forwardViews(b.forward_views)));

    if (b.limitations && b.limitations.length){
      const ul = el('ul','ul');
      b.limitations.forEach(t => ul.appendChild(el('li', null, esc(t))));
      main.appendChild(card('這份分析的已知缺口', ul));
    }
  }

  side.appendChild(card('被引用的證據　（點任一筆可反查是哪些結論引用它）',
    evidencePanel(data.evidence_catalog)));
  side.appendChild(card('後端稽核紀錄', verifyPanel(data.verification)));

  if (data.limitations && data.limitations.length){
    const ul = el('ul','ul');
    data.limitations.forEach(t => ul.appendChild(el('li', null, esc(t))));
    side.appendChild(card('本次執行的限制', ul));
  }
  side.appendChild(card(null, el('div','disc', esc((data.disclaimer || {}).text))));

  cols.appendChild(main); cols.appendChild(side);
  out.appendChild(cols);
}

/* ── 呼叫 API ─────────────────────────────────────────── */
let timer = null;
function progress(){
  const box = el('div','card');
  const line = el('p');
  line.appendChild(el('span','spin'));
  const t = el('span', null, '產生中… 0 秒');
  line.appendChild(t);
  box.appendChild(line);
  box.appendChild(el('p','hint','LLM 那一段實測約需 90 秒。想看即時進度可以看 uvicorn console 的 text_brief.* log。'));
  const st = el('div','stages');
  const spans = STAGES.map(s => { const n = el('span', null, s); st.appendChild(n); return n; });
  box.appendChild(st);
  $('status').innerHTML = '';
  $('status').appendChild(box);

  let sec = 0;
  timer = setInterval(() => {
    sec++;
    t.textContent = '產生中… ' + sec + ' 秒';
    // 依實測耗時粗略標示目前應該在哪一段（僅為 UI 提示，非後端回報）
    const at = sec < 2 ? 0 : sec < 3 ? 1 : sec < 92 ? 2 : 3;
    spans.forEach((n, i) => { n.className = i < at ? 'done' : i === at ? 'now' : ''; });
  }, 1000);
}
function stopProgress(){ if (timer){ clearInterval(timer); timer = null; } $('status').innerHTML = ''; }

function showError(title, detail){
  stopProgress();
  const box = el('div','err');
  box.appendChild(el('strong', null, title));
  if (detail) box.appendChild(el('code', null, typeof detail === 'string' ? detail : JSON.stringify(detail, null, 2)));
  $('status').appendChild(box);
}

async function run(){
  const base = $('api').value.replace(/\/+$/, '');
  const body = {symbol: $('sym').value, force_refresh: $('fresh').checked};
  if ($('asof').value) body.as_of_date = $('asof').value;

  $('go').disabled = true;
  $('out').classList.add('hide');
  $('meta').innerHTML = '';
  progress();
  const t0 = performance.now();
  try {
    const res = await fetch(base + '/analyze/stock-behavior/text-brief', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const ms = performance.now() - t0;
    const text = await res.text();
    let json = null;
    try { json = JSON.parse(text); } catch (_) {}
    if (!res.ok){
      const map = {422:'請求或政策檢查未通過', 503:'上游模型服務暫時無法回應，可稍後重試',
                   504:'分析逾時'};
      showError('HTTP ' + res.status + '　' + (map[res.status] || '請求失敗'),
        json ? (json.detail || json) : text.slice(0, 800));
      return;
    }
    stopProgress();
    render(json, {ms});
  } catch (err) {
    showError('連不上 API', String(err) +
      '\n\n請確認後端已啟動：\n  cd backend\n  uvicorn main:app --reload --port 8000\n\n' +
      '若只是要看畫面，按上方「載入離線範例」。');
  } finally {
    $('go').disabled = false;
  }
}

$('go').onclick = run;
$('demo').onclick = () => {
  stopProgress();
  if (!SAMPLE){ showError('這份檔案沒有內嵌離線範例'); return; }
  render(SAMPLE, {offline:true});
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') clearHL(); });
</script>
