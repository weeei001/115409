name: CI and Windows deployment

on:
  push:
    branches: [main, wei]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let an active production deployment finish before starting another run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      # The full legacy suite has known failures.
      - name: Check architecture, API startup, and streaming
        run: python -m pytest backend/tests/test_architecture.py backend/tests/test_system.py backend/tests/test_streaming.py backend/tests/test_volume_history.py backend/tests/test_orders.py backend/tests/test_admin.py backend/tests/test_admin_migrate.py backend/tests/test_job_runtime.py backend/tests/test_job_diagnostics.py backend/tests/test_scheduler.py backend/tests/test_jobs.py backend/tests/test_impact_cli.py backend/tests/test_news_impact.py backend/tests/test_news_company_identity.py backend/tests/test_chat_personal.py backend/tests/test_conversations.py backend/tests/test_auth.py backend/tests/test_market_import.py backend/tests/test_retrieval.py backend/tests/test_news_quality_retrieval.py backend/tests/test_security_parsing.py backend/tests/test_chat_hub.py -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/Topic
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8002
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/Topic/package-lock.json
      - run: npm ci
      - run: npm run test:chat
      - run: npm run test:volume
      - run: npm run test:order
      - run: npm run test:news
      - run: npm run test:compare
      - run: npm run test:admin
      - run: npm run test:brief
      - run: npm run test:home
      - run: npm run test:notifications
      # Next generates next-env.d.ts and route types on a fresh checkout.
      - run: npm run build
      - run: npm run lint -- --incremental false

  deploy:
    name: Deploy to Windows
    needs: [backend, frontend]
    if: >-
      vars.WINDOWS_CD_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64, stock-production]
    environment: production
    timeout-minutes: 45
    concurrency:
      group: windows-production
      cancel-in-progress: false
    env:
      DEPLOY_SCRIPT: ${{ vars.WINDOWS_DEPLOY_SCRIPT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Deploy the tested commit using the host's local script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DEPLOY_SCRIPT -or -not [IO.Path]::IsPathRooted($env:DEPLOY_SCRIPT) -or
              -not (Test-Path -LiteralPath $env:DEPLOY_SCRIPT -PathType Leaf)) {
              throw 'Set WINDOWS_DEPLOY_SCRIPT to the absolute path of the host deployment script.'
          }
          $deployScript = [IO.Path]::GetFullPath($env:DEPLOY_SCRIPT)
          $checkout = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
          if ($deployScript.StartsWith($checkout, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'The trusted deployment script must be outside the runner checkout.'
          }
          & $deployScript -SourcePath $env:GITHUB_WORKSPACE -Revision $env:GITHUB_SHA
          if (-not $?) { throw 'Windows deployment failed.' }
