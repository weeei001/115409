version: 2
# Disable routine version PRs; security updates remain enabled.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /frontend/Topic
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
