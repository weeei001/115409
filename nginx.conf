events {}

http {
    server {
        listen 80;

        # 拒絕所有直接訪問根目錄或亂猜路徑的請求
        location / {
            return 404;
        }

        # API 端點
        location ^~ /api/ {
            proxy_pass http://api_server:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 支援 SSE stream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
        }

        # 前端靜態頁面 + FastAPI docs
        location ^~ /X9k2mR_rag/ {
            proxy_pass http://api_server:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI docs 所需的根路徑資源（openapi.json、docs static assets）
        location ~ ^/(openapi\.json|docs|redoc|favicon\.ico) {
            proxy_pass http://api_server:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
